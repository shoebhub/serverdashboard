services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: proxmox-dashboard-server
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - ./server/.env
    volumes:
      - server-data:/app/data
    networks:
      - dashboard-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: proxmox-dashboard-client
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - BACKEND_URL=http://server:4000
      - NEXT_PUBLIC_API_URL=http://localhost:4000/api
    depends_on:
      server:
        condition: service_healthy
    networks:
      - dashboard-net

  prometheus:
    image: prom/prometheus:latest
    container_name: proxmox-dashboard-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus-docker.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    depends_on:
      - server
    networks:
      - dashboard-net

volumes:
  server-data:
  prometheus-data:

networks:
  dashboard-net:
    driver: bridge
